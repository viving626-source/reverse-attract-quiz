<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1024">
<title>你的反向魅力 · 你无意识吸引哪一类人</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e58bc9'/%3E%3Cstop offset='1' stop-color='%238b7cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23f5f1ea'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%230d1024'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ===== Token ===== */
:root{
  --bg:#0d1024;
  --bg2:#121631;
  --card:rgba(255,255,255,.05);
  --card-line:rgba(255,255,255,.10);
  --ink:#f5f1ea;
  --ink-2:#b9b4d0;
  --ink-3:#8b86a6;
  --gold:#e9b268;
  --rose:#e58bc9;
  --violet:#8b7cf6;
  --mint:#7fd8c4;
  --danger:#ff6b81;
  --radius:22px;
  --shadow:0 24px 60px rgba(0,0,0,.45);
  --font-serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --font-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  line-height:1.6;
  overflow-x:hidden;
}
/* 背景光晕 */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(58% 42% at 12% 8%, rgba(139,124,246,.28), transparent 60%),
    radial-gradient(52% 44% at 88% 12%, rgba(229,139,201,.20), transparent 62%),
    radial-gradient(70% 55% at 50% 105%, rgba(233,178,104,.16), transparent 60%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(1.4px 1.4px at 20% 30%, rgba(255,255,255,.5) 50%, transparent 50%),
    radial-gradient(1.4px 1.4px at 70% 70%, rgba(255,255,255,.4) 50%, transparent 50%),
    radial-gradient(1.2px 1.2px at 45% 85%, rgba(255,255,255,.35) 50%, transparent 50%);
  background-size:220px 220px,260px 260px,200px 200px;
  opacity:.5;
  pointer-events:none;
}
.wrap{
  max-width:520px;margin:0 auto;padding:28px 20px calc(40px + env(safe-area-inset-bottom));
  position:relative;min-height:100vh;
}
/* ===== 视图容器 ===== */
.view{display:none}
.view.active{display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== 通用卡片 ===== */
.card{
  background:var(--card);
  border:1px solid var(--card-line);
  border-radius:var(--radius);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
}

/* ===== 按钮 ===== */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:15px 18px;border:none;border-radius:16px;
  font-family:var(--font-sans);font-size:16px;font-weight:600;color:var(--ink);
  cursor:pointer;transition:transform .15s ease, box-shadow .2s ease, opacity .2s;
  -webkit-user-select:none;user-select:none;text-align:center;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(135deg,#8b7cf6,#e58bc9);
  color:#fff;box-shadow:0 10px 28px rgba(139,124,246,.35);
}
.btn-ghost{
  background:transparent;border:1px solid var(--card-line);color:var(--ink-2);
}
.btn-gold{
  background:linear-gradient(135deg,#e9b268,#ef9a7e);color:#241a10;
  box-shadow:0 10px 26px rgba(233,178,104,.3);
}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* ===== 封面 / 密码页 ===== */
.brand{text-align:center;padding-top:30px}
.brand-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:100px;
  border:1px solid rgba(229,139,201,.4);color:var(--rose);
  font-size:12.5px;letter-spacing:1px;
  background:rgba(229,139,201,.08);
}
.brand h1{
  font-family:var(--font-serif);font-weight:900;font-size:34px;line-height:1.2;
  margin:18px 0 6px;letter-spacing:1px;
}
.brand h1 .thin{color:var(--rose);font-weight:600}
.brand .sub{color:var(--ink-2);font-size:14.5px}
.brand .tick{color:var(--gold)}
.lock-note{
  margin-top:20px;padding:16px 18px;font-size:13px;color:var(--ink-2);
  border-left:3px solid var(--rose);background:rgba(229,139,201,.06);border-radius:0 14px 14px 0;
}
.lock-note b{color:var(--ink);font-weight:600}
.input-wrap{position:relative;margin-top:26px}
.input-wrap input{
  width:100%;padding:17px 46px 17px 20px;border-radius:16px;
  background:rgba(255,255,255,.06);border:1px solid var(--card-line);color:var(--ink);
  font-size:18px;letter-spacing:4px;font-family:var(--font-sans);outline:none;
}
.input-wrap input::placeholder{color:var(--ink-3);letter-spacing:1px;font-size:15px}
.input-wrap input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,124,246,.18)}
.lock-actions{margin-top:16px}
.hint{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:14px}
.err{color:var(--danger);font-size:13px;text-align:center;margin-top:12px;min-height:20px}
.remain{
  text-align:center;margin-top:14px;font-size:13px;color:var(--ink-2);
}
.remain b{color:var(--gold)}

/* ===== 答题页 ===== */
.quiz-head{margin-bottom:20px}
.progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);margin-bottom:10px}
.progress-meta .pct{color:var(--gold);font-weight:600}
.progress-bar{height:6px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden}
.progress-bar i{display:block;height:100%;width:0;border-radius:100px;
  background:linear-gradient(90deg,#8b7cf6,#e58bc9);transition:width .35s ease}
.quiz-title{font-size:12.5px;letter-spacing:1px;color:var(--violet);margin-bottom:4px}
.q-body{padding:24px}
.q-text{
  font-family:var(--font-serif);font-weight:600;font-size:21px;line-height:1.5;margin-bottom:22px;
}
.options{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:flex-start;gap:12px;padding:15px 16px;
  background:rgba(255,255,255,.045);border:1.5px solid var(--card-line);border-radius:15px;
  cursor:pointer;transition:all .18s ease;font-size:15px;color:var(--ink);
}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--ink-3);font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:1px;
}
.opt:hover{border-color:var(--violet);background:rgba(139,124,246,.08)}
.opt.sel{border-color:var(--rose);background:rgba(229,139,201,.10)}
.opt.sel .k{background:linear-gradient(135deg,#8b7cf6,#e58bc9);border-color:transparent;color:#fff}
.quiz-foot{display:flex;gap:10px;margin-top:20px}
.quiz-foot .btn{width:auto;flex:0 0 auto;padding:14px 0}
.quiz-foot .btn-back{flex:1;min-width:96px}
.quiz-foot .btn-next{flex:2}
.q-tip{text-align:center;font-size:12px;color:var(--ink-3);margin-top:14px}

/* ===== 结果页 ===== */
.result-wrap{display:none}
.result-wrap.show{display:block;animation:fade .5s ease}
.result-card{
  position:relative;overflow:hidden;border-radius:var(--radius);
  padding:26px 24px 28px;border:1px solid var(--card-line);
  background:linear-gradient(160deg, rgba(139,124,246,.16), rgba(229,139,201,.10) 55%, rgba(233,178,104,.10));
  box-shadow:var(--shadow);
}
.result-card::before{
  content:"";position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle, rgba(229,139,201,.30), transparent 65%);pointer-events:none;
}
.result-card::after{
  content:"";position:absolute;bottom:-90px;left:-70px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle, rgba(139,124,246,.26), transparent 65%);pointer-events:none;
}
.r-label{font-size:12.5px;letter-spacing:1.5px;color:var(--gold);position:relative;z-index:1}
.r-name{font-family:var(--font-serif);font-weight:900;font-size:30px;margin:10px 0 4px;position:relative;z-index:1;letter-spacing:1px}
.r-tagline{font-size:15px;color:var(--ink-2);position:relative;z-index:1;margin-bottom:6px}
.r-hr{height:1px;background:rgba(255,255,255,.12);margin:18px 0;position:relative;z-index:1}
.r-section{position:relative;z-index:1;margin-bottom:18px}
.r-section h4{font-size:13px;letter-spacing:1px;color:var(--rose);margin-bottom:8px;font-family:var(--font-sans);font-weight:700}
.r-section p{font-size:14.5px;color:var(--ink-2);line-height:1.75}
.r-quote{
  position:relative;z-index:1;margin:20px 0 0;padding:16px 18px;border-radius:14px;
  background:rgba(13,16,36,.35);border:1px solid rgba(233,178,104,.28);
  font-family:var(--font-serif);font-size:16px;color:var(--gold);text-align:center;line-height:1.7;
}
.r-disclaimer{font-size:11.5px;color:var(--ink-3);text-align:center;margin:18px 0 6px;position:relative;z-index:1}
.result-actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.result-actions .btn{padding:14px 16px}
.result-actions .btn-row{display:flex;gap:10px}
.result-actions .btn-row .btn{flex:1;padding:14px 4px;font-size:14.5px}

/* ===== 弹窗 ===== */
.modal-mask{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(5,7,18,.72);padding:24px;backdrop-filter:blur(4px);
}
.modal-mask.show{display:flex;animation:fade .25s ease}
.modal{
  width:100%;max-width:360px;background:linear-gradient(165deg,#1b2040,#151935);
  border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px 22px;text-align:center;
  box-shadow:var(--shadow);position:relative;
}
.modal .m-icon{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#8b7cf6,#e58bc9);font-size:26px;color:#fff}
.modal h3{font-family:var(--font-serif);font-size:21px;margin-bottom:10px}
.modal p{font-size:14.5px;color:var(--ink-2);line-height:1.8;margin-bottom:18px}
.modal p b{color:var(--gold)}
.modal .btn{margin-top:4px}
.modal .m-close{
  position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.08);border:none;color:var(--ink-2);font-size:16px;cursor:pointer;line-height:1;
  font-family:var(--font-sans);
}

/* ===== toast ===== */
#toast{
  position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);
  background:rgba(30,34,60,.96);border:1px solid var(--card-line);color:var(--ink);
  padding:12px 20px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;
  transition:all .3s ease;z-index:200;max-width:86%;text-align:center;box-shadow:var(--shadow);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 隐藏的导出容器 ===== */
#exportRoot{position:absolute;left:-9999px;top:0;width:420px}

/* ===== 桌面端微调 ===== */
@media(min-width:768px){
  .wrap{padding:44px 24px calc(60px + env(safe-area-inset-bottom))}
  .brand h1{font-size:40px}
  .q-text{font-size:22px}
}

/* reduced motion */
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 视图：密码页 ===== -->
  <section id="view-lock" class="view active">
    <div class="brand">
      <div class="brand-badge">REVERSE ATTRACTION TEST</div>
      <h1>你的<span class="thin">「反向魅力」</span><br>你无意识吸引哪一类人</h1>
      <p class="sub">你以为你在选择，其实你的气场早就在筛选。</p>
    </div>
    <div class="lock-note">
      <b>测试说明：</b> 约 3 分钟，12 道情境选择题。本测评为趣味娱乐用途，非专业心理评估。
    </div>
    <div class="input-wrap">
      <input id="pwdInput" type="password" inputmode="numeric" placeholder="输入体验密码" autocomplete="off" maxlength="12">
    </div>
    <div class="lock-actions">
      <button id="btnUnlock" class="btn btn-primary">开始测试</button>
    </div>
    <div id="lockErr" class="err"></div>
    <div id="remainTip" class="remain"></div>
    <p class="hint">每个密码限测 3 次 · 分享链接查看结果不占用次数</p>
  </section>

  <!-- ===== 视图：答题页 ===== -->
  <section id="view-quiz" class="view">
    <div class="quiz-head">
      <div class="progress-meta"><span id="qIndex">第 1 题 / 共 12 题</span><span id="qPct" class="pct">0%</span></div>
      <div class="progress-bar"><i id="qBar"></i></div>
    </div>
    <div class="card">
      <div class="q-body">
        <div id="qTitle" class="quiz-title"></div>
        <p id="qText" class="q-text"></p>
        <div id="qOptions" class="options"></div>
        <div class="quiz-foot">
          <button id="btnBack" class="btn btn-ghost btn-back">← 上一题</button>
          <button id="btnNext" class="btn btn-primary btn-next" disabled>下一题 →</button>
        </div>
      </div>
    </div>
    <p class="q-tip">已选择的答案可随时返回修改</p>
  </section>

  <!-- ===== 视图：结果页 ===== -->
  <section id="view-result" class="view">
    <div id="resultRoot"></div>
    <div class="result-actions">
      <button id="btnSave" class="btn btn-gold">保存测试结果（生成精美长图）</button>
      <div class="btn-row">
        <button id="btnShare" class="btn btn-primary">复制结果链接</button>
        <button id="btnRetest" class="btn btn-ghost">再测一次</button>
      </div>
      <button id="btnReview" class="btn btn-ghost">好评有礼 · 领 1 元返现</button>
    </div>
    <div class="r-disclaimer">趣味测试 · 仅供参考 · 请理性看待结果</div>
  </section>

</div>

<!-- ===== 好评有礼弹窗 ===== -->
<div id="reviewModal" class="modal-mask">
  <div class="modal">
    <button id="reviewClose" class="m-close" aria-label="关闭">×</button>
    <div class="m-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 7V2"/><path d="M12 2c-2 0-3 2-3 2s0 2 3 2 3-2 3-2-1-2-3-2z"/></svg></div>
    <h3>好评有礼</h3>
    <p>完成测试后，请在店铺留下<b>五星好评</b>。好评完成后，请<b>联系客服并发送好评截图</b>，即可获得 <b>1 元现金返现</b>。</p>
    <button id="reviewGot" class="btn btn-primary">知道了，谢谢提醒</button>
  </div>
</div>

<div id="toast"></div>

<!-- 导出的长图根节点 -->
<div id="exportRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
/* ===== 配置 ===== */
var PASSWORD_POOL = ["888888"];              // 体验密码池：可添加多个密码
var MAX_PER_PWD   = 3;                       // 每个密码限测次数
var STORE_KEY     = "reverse_attract_quota";

/* ===== 题目数据 ===== */
var QUESTIONS = [
  {title:"能量 · 日常", text:"周末下午，你最想怎么过？", options:[
    {t:"约朋友聚会探店、逛街喝奶茶，闹哄哄的才有劲", tag:"Vibe"},
    {t:"一个人在家看书、听歌、发呆，就很满足", tag:"Mystery"},
    {t:"和两三个知己找个安静咖啡馆深聊", tag:"Tender"},
    {t:"收拾屋子、整理生活，把一周的乱摊子理顺", tag:"Cure"}
  ]},
  {title:"表达 · 被感知", text:"朋友最常用哪三个字形容你？", options:[
    {t:"靠谱、让人安心", tag:"Anchor"},
    {t:"有趣、脑洞大、气氛担当", tag:"Vibe"},
    {t:"有想法、说话有说服力", tag:"Guide"},
    {t:"安静但很有深度", tag:"Mystery"}
  ]},
  {title:"能量 · 情绪承接", text:"朋友深夜向你倒苦水，你的第一反应是？", options:[

    {t:"安静陪着，不多说话", tag:"Anchor"}

  {title:"表达 · 姿态", text:"开会或小组讨论时，你通常是？", options:[
    {t:"主动抛观点、带动节奏", tag:"Vibe"},
    {t:"先听，关键处补一句定调", tag:"Guide"},

    {t:"总提出别人没想到的视角", tag:"Tender"}
  ]},
  {title:"关系 · 自我展露", text:"你愿意向别人展示自己的脆弱吗？", options:[

    {t:"温和但内心有故事的人", tag:"Guide"}
  ]},
  {title:"能量 · 冲突", text:"和别人意见不合时，你更倾向？", options:[

  ]},
  {title:"表达 · 生活感", text:"你的房间或工位通常是？", options:[

    {t:"有生活感，摆满喜欢的物件和绿植", tag:"Cure"},

    {t:"有点乱但有自己的逻辑", tag:"Tender"}
  ]},
  {title:"能量 · 耗散", text:"参加完大型聚会，你通常是？", options:[
    {t:"精力满满，还想续摊", tag:"Vibe"},
    {t:"开心但有点累，想独处回血", tag:"Mystery"},
    {t:"其实不太想去，去了话也不多", tag:"Tender"},
    {t:"看和谁在一起，处得来就放开", tag:"Guide"}
  ]},
  {title:"关系 · 被依赖", text:"朋友们遇到大事，最常找你？", options:[
    {t:"当树洞，需要安慰理解时", tag:"Cure"},
    {t:"拿主意、做决定时", tag:"Guide"},
    {t:"需要有人带着放松、解压时", tag:"Vibe"},

  {title:"能量 · 隐藏面", text:"别人眼里你可能很通透，但私下其实？", options:[

var ORDER = ["Cure","Tender","Vibe","Guide","Mystery","Anchor"];

/* ===== 视图路由 ===== */
var views = {lock:document.getElementById("view-lock"), quiz:document.getElementById("view-quiz"), result:document.getElementById("view-result")};
function showView(name){
  Object.keys(views).forEach(function(k){ views[k].classList.remove("active"); });
  views[name].classList.add("active");
  window.scrollTo(0,0);
}

/* ===== 配额（本地存储） ===== */
function getQuota(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||"{}")||{}; }catch(e){ return {}; } }
function getUsed(pwd){ return getQuota()[pwd] || 0; }
function addUsed(pwd){
  var q = getQuota(); q[pwd] = (q[pwd]||0) + 1;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(q)); }catch(e){}
}
var curPwd = null;

/* ===== toast ===== */
var toastTimer=null;
function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove("show"); },2600);
}

/* ===== 答题状态 ===== */
var answers = [];       // answers[i] = 选中选项 index，未答为 null
var qIdx = 0;

function startQuiz(){
  qIdx=0;
  showView("quiz");
  renderQ();
}
function renderQ(){
  var q = QUESTIONS[qIdx];
  document.getElementById("qTitle").textContent = q.title;
  document.getElementById("qText").textContent = q.text;
  document.getElementById("qIndex").textContent = "第 "+(qIdx+1)+" 题 / 共 "+QUESTIONS.length+" 题";
  document.getElementById("qPct").textContent = Math.round(((qIdx)/(QUESTIONS.length))*100)+"%";
  document.getElementById("qBar").style.width = ((qIdx)/(QUESTIONS.length))*100+"%";
  var box = document.getElementById("qOptions"); box.innerHTML="";
  q.options.forEach(function(opt, i){
    var d=document.createElement("div");
    d.className="opt"+(answers[qIdx]===i?" sel":"");
    d.innerHTML='<span class="k">'+String.fromCharCode(65+i)+'</span><span>'+opt.t+'</span>';
    d.onclick=function(){ answers[qIdx]=i; renderQ(); };
    box.appendChild(d);
  });
  document.getElementById("btnBack").disabled = (qIdx===0);
  document.getElementById("btnNext").disabled = (answers[qIdx]===undefined||answers[qIdx]===null);
  document.getElementById("btnNext").textContent = (qIdx===QUESTIONS.length-1) ? "查看结果 →" : "下一题 →";
}
document.getElementById("btnBack").onclick=function(){
  if(qIdx>0){ qIdx--; renderQ(); }
};
document.getElementById("btnNext").onclick=function(){
  if(answers[qIdx]===undefined||answers[qIdx]===null){ toast("请先选择一个选项"); return; }
  if(qIdx<QUESTIONS.length-1){ qIdx++; renderQ(); }
  else{ finishTest(); }
};

/* ===== 结果计算 ===== */
function computeResult(){
  var score={}; ORDER.forEach(function(k){ score[k]=0; });
  for(var i=0;i<answers.length;i++){
    var idx=answers[i];
    if(idx==null||idx<0) continue;
    var tag=QUESTIONS[i].options[idx].tag;
    score[tag]++;
  }
  var best=ORDER[0], max=-1;
  ORDER.forEach(function(k){ if(score[k]>max){ max=score[k]; best=k; } });
  return {key:best, data:RESULTS[best], score:score};
}

document.getElementById("btnSave").onclick=function(){
  var computed = computeResult();
  var el = buildExport(computed);
  toast("正在生成图片…");
  setTimeout(function(){
    html2canvas(el, {scale:2, backgroundColor:"#131633", useCORS:true, logging:false})
      .then(function(canvas){
        var link=document.createElement("a");
        link.download = "反向魅力-" + computed.data.name + ".png";
        canvas.toBlob(function(blob){
          if(blob){
            link.href = URL.createObjectURL(blob);
            document.body.appendChild(link); link.click();
            setTimeout(function(){ URL.revokeObjectURL(link.href); link.remove(); },800);
            toast("已生成，请保存到相册 / 图片文件夹");
          } else {
            window.open(canvas.toDataURL("image/png"), "_blank");
          }
        }, "image/png");
      })
      .catch(function(){ toast("生成失败，请重试"); });
  },80);
};

/* ===== 复制结果链接 ===== */
function encodeAns(){
  var a = answers.slice(); for(var i=0;i<a.length;i++){ if(a[i]==null||a[i]<0) a[i]=-1; }
  return btoa(unescape(encodeURIComponent(JSON.stringify(a))));
}
function decodeAns(str){
  try{ var j=JSON.parse(decodeURIComponent(escape(atob(str)))); return j; }catch(e){ return null; }
}
document.getElementById("btnShare").onclick=function(){
  if(answers.length===0){ toast("请先完成测试"); return; }
  var url = location.origin + location.pathname + "?r=" + encodeAns();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ toast("结果链接已复制，去分享吧"); },function(){ shareFallback(url); });
  } else { shareFallback(url); }
};
function shareFallback(url){
  var ta=document.createElement("textarea"); ta.value=url; document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); toast("结果链接已复制"); }catch(e){ prompt("复制此链接分享给朋友：", url); }
  ta.remove();
}

/* ===== 密码验证 ===== */
function refreshRemain(){
  var el=document.getElementById("remainTip");
  if(curPwd){ el.innerHTML = "当前密码剩余可测 <b>"+(MAX_PER_PWD-getUsed(curPwd))+"</b> 次"; }
  else{ el.innerHTML=""; }
}
document.getElementById("btnUnlock").onclick=function(){
  var pwd=document.getElementById("pwdInput").value.trim();
  var err=document.getElementById("lockErr");
  if(!pwd){ err.textContent="请输入体验密码"; return; }
  if(PASSWORD_POOL.indexOf(pwd)===-1){ err.textContent="密码不正确，请重新输入"; return; }
  if(getUsed(pwd) >= MAX_PER_PWD){ err.textContent="该密码测试次数已用完，请更换密码"; return; }
  err.textContent=""; curPwd=pwd; refreshRemain(); startQuiz();
};
document.getElementById("pwdInput").addEventListener("keydown",function(e){
  if(e.key==="Enter") document.getElementById("btnUnlock").click();
});

/* ===== 完成测试：结果 + 计次 ===== */
function finishTest(){
  var computed = computeResult();
  renderResult(computed);
  if(curPwd){ addUsed(curPwd); refreshRemain(); }
}

/* ===== 初始化：分享链接直达结果 ===== */
(function init(){
  var m=location.search.match(/[?&]r=([^&]+)/);
  if(m && decodeAns(m[1])){
    var arr=decodeAns(m[1]);
    if(Array.isArray(arr) && arr.length===QUESTIONS.length){
      answers=arr; var c=computeResult(); renderResult(c);
      return;
    }
  }
  refreshRemain();
})();
